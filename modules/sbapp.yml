name: sbapp
sources:
  - type: file
    url: https://github.com/markqvist/Sideband/releases/download/2.0.1/sbapp-2.0.1-py3-none-any.whl
    sha256: bd7cf28e01613b19f870ea4de813451840b2c76922c81084501baf311c586e9b
    x-checker-data:
      type: json
      url: https://api.github.com/repos/markqvist/Sideband/releases/latest
      version-query: .tag_name
      url-query: .assets[] | select(.name == ("sbapp-" + $version + "-py3-none-any.whl"))
        | .browser_download_url

buildsystem: simple
builddir: true
build-commands:
  - pip3 install --verbose --no-index --no-build-isolation --prefix /app *.whl
