name: sbapp
sources:
  - type: file
    url: https://github.com/markqvist/Sideband/releases/download/2.1.0/sbapp-2.1.0-py3-none-any.whl
    sha256: 5985e233651368360a1ae3c727e41bac9b66abf6abfe3aa43f6db41972a82df4
    x-checker-data:
      type: json
      url: https://api.github.com/repos/markqvist/Sideband/releases/latest
      version-query: .tag_name
      url-query: .assets[] | select(.name == ("sbapp-" + $version + "-py3-none-any.whl"))
        | .browser_download_url

buildsystem: simple
builddir: true
build-commands:
  - pip3 install --verbose --no-index --no-build-isolation --prefix /app *.whl
