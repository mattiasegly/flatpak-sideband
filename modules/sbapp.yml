name: sbapp
sources:
  - type: file
    url: https://github.com/markqvist/Sideband/releases/download/2.3.0/sbapp-2.3.0-py3-none-any.whl
    sha256: 918e20217083e893c3b7be2f86b37df90e294b91477cf42e60d06a5dd181de39
    x-checker-data:
      type: json
      url: https://api.github.com/repos/markqvist/Sideband/releases/latest
      version-query: .tag_name
      url-query: .assets[] | select(.name == ("sbapp-" + $version + "-py3-none-any.whl"))
        | .browser_download_url

buildsystem: simple
builddir: true
build-commands:
  - pip3 install --verbose --no-index --no-build-isolation --prefix /app *.whl
