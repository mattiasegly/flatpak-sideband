name: sbapp
sources:
  - type: file
    url: https://github.com/markqvist/Sideband/releases/download/2.3.1/sbapp-2.3.1-py3-none-any.whl
    sha256: b30477d2d9a7a8c40f7eb3c81733989d3ea339e8a9f360dd626e210f65ae7bec
    x-checker-data:
      type: json
      url: https://api.github.com/repos/markqvist/Sideband/releases/latest
      version-query: .tag_name
      url-query: .assets[] | select(.name == ("sbapp-" + $version + "-py3-none-any.whl"))
        | .browser_download_url

buildsystem: simple
builddir: true
build-commands:
  - pip3 install --verbose --no-index --no-build-isolation --prefix /app *.whl
