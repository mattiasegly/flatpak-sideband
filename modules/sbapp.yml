name: sbapp
sources:
  - type: file
    url: https://github.com/markqvist/Sideband/releases/download/2.2.0/sbapp-2.2.0-py3-none-any.whl
    sha256: 90e9fb0b6c702799fe1d84d8dbbb15e66038b3ab670f2406be09ea20297e1181
    x-checker-data:
      type: json
      url: https://api.github.com/repos/markqvist/Sideband/releases/latest
      version-query: .tag_name
      url-query: .assets[] | select(.name == ("sbapp-" + $version + "-py3-none-any.whl"))
        | .browser_download_url

buildsystem: simple
builddir: true
build-commands:
  - pip3 install --verbose --no-index --no-build-isolation --prefix /app *.whl
